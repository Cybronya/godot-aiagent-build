# Skill Schema
# Defines the contract that every Skill must satisfy.

schema:
  id: skill
  version: 2

canonical_source:
  type: skill_file
  description: >
    SKILL.md is the canonical source for Skill identity, metadata,
    ownership, dependencies and operational contracts.
  rule: >
    Registry entries are an index for discovery and path resolution.
    Registry must not redefine canonical Skill metadata.

required:
  - id
  - name
  - version
  - category
  - description
  - purpose
  - responsibility
  - load_policy

identity:
  id:
    type: string
    rule: "Must match the Skill directory name."
  name:
    type: string
  version:
    type: string
  category:
    type: string
    rule: "Must exist in skill-types.yaml."

structure:
  required_file:
    - SKILL.md
  optional_directories:
    - references
    - templates
    - examples

metadata:
  description:
    type: string
  purpose:
    type: string
  responsibility:
    type: structured
  load_policy:
    type: enum
    values:
      - required
      - conditional
      - optional

operational_contract:
  required:
    - trigger_conditions
    - input_contract
    - workflow
    - output_contract
    - validation
    - failure_handling

dependencies:
  required:
    type: list
  related:
    type: list

registry_contract:
  registry_role: discovery_index
  required_fields:
    - id
    - path
  forbidden_canonical_fields:
    - name
    - version
    - category
    - load_policy
    - dependencies
    - related
  rules:
    - Registry id must match the canonical Skill id.
    - Registry path must resolve to the canonical Skill directory.
    - Registry must not become a second source of Skill metadata.

rules:
  - A Skill must have one stable identity.
  - SKILL.md is the canonical source of Skill metadata.
  - A Skill must declare its category.
  - A Skill must declare its load policy.
  - A Skill must satisfy the operational contract defined by the Skill Template.
  - A Skill must not silently redefine another Skill's ownership.
  - A Skill directory must contain SKILL.md.
