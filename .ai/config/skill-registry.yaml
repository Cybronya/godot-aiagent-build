# Skill Registry
# The authoritative catalog of Skills available to this Agent.

registry:
  id: godot-agent-skills
  version: 1

skills:

  - id: godot-project-architecture
    name: Godot 项目架构
    category: architecture
    path: ../skills/architecture/godot-project-architecture
    load_policy: conditional
    dependencies:
      required:
        - godot-development-standard
      related: []

  - id: godot-development-standard
    name: Godot 开发规范
    category: foundation
    path: ../skills/foundation/godot-development-standard
    load_policy: required
    dependencies:
      required: []
      related:
        - godot-project-architecture

registry_rules:
  - Every registered Skill must have a valid SKILL.md.
  - Skill id must equal its directory name.
  - Category must exist in skill-types.yaml.
  - Registry paths must resolve relative to this registry file.
  - Do not register speculative Skills before their Skill files exist.
  - Registry required dependencies must exactly match the Skill's required dependencies.
  - Registry related entries may only reference Skills that are registered.
  - A Skill may declare related Skills that are not yet registered; these are planned collaboration targets and must not be added to the registry until their Skill files exist.
