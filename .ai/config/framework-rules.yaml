# Framework Rules

framework:
  version: 1

principles:
  - Agent is the root conceptual owner.
  - .config defines the Skill Framework.
  - skills define Agent capabilities.
  - Skill categories define capability roles.
  - Skill dependencies must be explicit.
  - Skill collaboration must preserve ownership boundaries.
  - Project-specific knowledge belongs to project-managed memory, not Framework configuration.
  - User decisions have highest priority.

path_resolution:
  rule: relative_paths
  description: Framework internal paths must not depend on the Framework root directory name.

  resolution_base:
    config_file: Resolve paths relative to the directory containing the config file that declares the path.
    skill_file: Resolve Skill-local paths relative to the directory containing the SKILL.md that declares the path.

  rules:
    - Do not hardcode .ai, .agent, or any Framework root directory name in Framework-internal paths.
    - Config references must use paths relative to their declaring config file.
    - Skill-local references must use paths relative to the Skill directory.
    - Renaming the Framework root directory must not require updates to internal paths.

change_policy:
  safe_changes:
    - add_skill_registry_entry_for_existing_skill
    - add_nonbreaking_skill_type
    - update_skill_metadata
    - update_loading_trigger

  review_required:
    - change_skill_schema
    - rename_skill_category
    - change_dependency_direction
    - change_required_dependency
    - remove_skill_type
    - change_framework_version

consistency_checks:
  - all_registered_skills_exist
  - all_skill_categories_exist
  - all_required_dependencies_exist
  - no_circular_required_dependencies
  - skill_ids_match_directories
  - registry_and_skill_metadata_are_consistent
  - framework_internal_paths_are_relative
