# Contract Index —— 所有 AI 协议入口的单一目录。
# 作用：Agent 不再扫描 .ai/tools / .ai/context 找规则；读本文件即知每个契约的
# schema 文档、生产/消费工具与当前版本。
# 维护规则：任何新增/升级契约的 Phase 必须同步更新本索引（只记录事实，不写流程；
# 流程在 SKILL.md 与 README.md）。只 CHECK/REPORT 的 validator 不在本索引之外的
# 任何地方重复声明版本。
# 通用规则：schema 文档是 Source of Truth（人工维护）；工具产物（asset_index.json、
# asset_bindings/*.yaml）是 Generated Data，可按各契约的 producer 重建。

version: 1

# 路径基准（Agent 解析规则）：
#   *  schema / files / generated_cache / output_dir / index / boundary_contract /
#      repair_plan_schema / runtime_result_schema → 相对 .ai/context/
#   *  cli / entrypoint / validator / producer / consumer / stages / contract_test /
#      runtime_test / runner / asset_repair / index_builder → 相对 .ai/tools/
#   *  navigation 内相对 .ai/context/（含 ../ 跨层引用）

# ---------- Asset ----------

asset_scan:
  schema: asset_schema.yaml
  cli: asset_registry/scan_assets.py
  index_builder: asset_registry/build_asset_index.py   # Generated Cache 重建入口
  generated_cache: asset_index.json                    # 不手工维护；--check 判同步
  version: 1

asset_query:
  schema: asset_query_schema.yaml
  cli: asset_registry/query_assets.py                  # 位置参数 = 旧 CLI；--json --query = Agent API
  version: 1

asset_compatibility:
  cli: asset_registry/check_compatibility.py           # COMPATIBLE/WARNING/INCOMPATIBLE/UNKNOWN
  version: 1

asset_binding:
  schema: asset_binding_schema.yaml
  schema_version: 2                                    # 与 asset_binding_schema.yaml version 一致
  producer:                                            # 生成 asset_bindings/*.yaml 的三条链路
    cli: asset_registry/bind_assets.py                 # 显式绑定覆盖输入支持可选 entity 作用域（Phase 1.15，I1）：
                                                       #   {role, asset}          角色级（历史格式，作用于全部实体）
                                                       #   {entity, role, asset}  实体作用域（只路由到该实体）
                                                       #   未知实体 → binding_scope_errors（exit 1，可定位）；
                                                       #   类型门禁拒绝 audio↔visual 错配且不回退推断。
                                                       #   权威实现：bind_assets.parse_explicit_bindings
    scene_composer: scene_composer/asset_nodes.py      # --bind-assets 消费端入口
    runtime_repair: runtime/asset_repair.py            # Asset Self-Repair 重建入口
  scope_rule_test: asset_registry/tests/test_binding_scope.py    # I1-A…I1-G + S6（身份解析）
  cross_layer_test: validator/tests/test_cross_layer_contract.py # C9（作用域边界）
  e2e_adoption:                                        # Phase 1.16：实体作用域接入主生成链路
    flow: "feature_discovery(payload.role) + gameplay 蓝图实体清单
          → discovery_to_binding --resolve-entity-from（解析唯一实体 id，打上 {entity,role,asset}）
          → bind_assets --gameplay --binding（作用域路由）→ scene_composer --bindings（落盘 .tscn）
          → 真实 Godot headless（G8/G9/G10a）"
    zero_or_ambiguous_role: "exit 1 + no_entity_with_role / ambiguous_entity_role（不猜测归属）"
    legacy_path: "缺省（无 --entity/--resolve-entity-from）仍产出 {role, asset}（e2e C3b/I2）"
    test: e2e/tests/test_end_to_end_generation.py      # C2a/C3/C3b/C6/D6/D7/D8/I1/I1b/I2（场景 1–6）
  dual_entity_adoption:                                # Phase 1.17：双实体显式绑定闭环 + 多实体组合
    player_flow: "player discovery（role=player）→ --resolve-entity-from（player probe 蓝图唯一
          player 实体）→ bind_assets（player_* 全部 resolved_from=binding）
          → scene_composer 生成 E2eProbePlayer.tscn"
    no_cross_leak: "enemy 场景无 characters/player 资源、player 场景无 characters/enemy 资源
          （静态 L8）+ 运行时子树资源归属断言（L13/L14，真实 Godot）"
    composition:
      implementation: scene_composer/composite.py      # 最小实现：Godot 原生 instancing
      rule: "宿主 .tscn 只声明 ext_resource + [node ... instance=ExtResource]；
             绝不复制/拼接实体场景内部文本；输入场景字节不变；实例名 = 实体场景根名（冲突自动消歧）"
      e2e: "L9/L10（组合与无拼接）+ L11（真实 Godot headless status=PASS）+
            L12–L15（实例存在/命名唯一/运行时资源归属/探针清理）"
  composition_plan:                                    # Phase 1.18：正式组合入口 + 运行时交互契约
    schema: scene_composer_schema.yaml#composition_plan
    implementation: scene_composer/composite.py        # compose_from_plan（唯一实现）
    formal_entry: scene_composer/scene_composer.py --compose-plan <plan.yaml>
                                                       # [--dry-run]；失败绝不留产物
    generator: scene_composer/plan_generator.py         # Phase 1.19：蓝图为源、自动生成计划
    generation:
      input: "gameplay blueprint + 已生成实体场景（override > entities.<id>.scene >\n			Scenes/<Pascal(entity_id)>.tscn 约定）"
      targets: "只接受 --target SRC:DST 或 --relations <entity_graph.json> --relation NAME；\n			绝不按 role 推断；source 必顶 Feature 声明 target_path（feature_index interfaces）"
      instance_name: "Pascal(entity_id)；同名派生冲突 = 拒绝（不静默消歧）"
      validation: "复用 compose_from_plan（临时目录真实试组合后删除）→ 不新增独立 plan Validator 层"
      write: "全部校验通过后才原子写入（.tmp + os.replace）；失败无产物"
      cli: "plan_generator.py <blueprint> --host NAME --out PLAN.yaml [--entity-scene E=P]\n			[--target S:T] [--relations G --relation N] [--dry-run] [--json]"
      unit_test: scene_composer/tests/test_plan_generator.py   # Q1–Q12（24 项）
      e2e: e2e/tests/test_end_to_end_generation.py             # M1–M6（计划的真实消费见 L9/L10/L16/L17）
    targets: "宿主在追击方实例节点写 target_path = NodePath('../<目标实例名>')；
             与 chase_movement 相对解析契约一致；目标未知 = 拒绝生成（exit 1）"
    input_claim: ">1 个实例场景引用 player_controller.gd = 拒绝（输入动作争用禁止）"
    identity_rule: "实体身份（蓝图 entity id）≠ 宿主实例名 ≠ 运行时 target 引用（NodePath）"
    unit_test: scene_composer/tests/test_composite.py  # P1–P7
    runtime_test: e2e L16–L17                          # 真实 Godot：target_path 解析 + 真实接近
  validator: asset_registry/check_binding_schema.py    # schema_version + 记录健康度（Phase 1.17）；
                                                       # 记录级 role/asset/entity 检查、--gameplay 实体
                                                       # 存在性（未知实体=ERROR）、binding_scope_errors
                                                       # 契约字段；无 --gameplay = note（信息不足）；
                                                       # 业务规则唯一权威仍是 bind_assets，不自动迁移
  schema_check_test: asset_registry/tests/test_binding_schema_checks.py  # S1–S9
  unified_layer:                                       # Phase 1.18：接入统一 Validator
    layer: binding                                     # LAYERS = scene/gameplay/level/binding/runtime
    implementation: validator/unified.py#run_binding_layer   # 复用 check_bindings（唯一实现，零规则复制）
    cli: validate.py --bindings-dir <dir> [--gameplay-blueprint <yaml>]
                                                       # 无蓝图 = info 诊断 BINDING_INFO_INSUFFICIENT_INPUT
                                                       #（如实展示，不计入 error/warning 基线）
    layer_test: validator/tests/test_unified_validator.py    # C10-e
  output_dir: asset_bindings                           # 产物均为 Generated Data
  version: 2

asset_manifest:
  schema: asset_manifest_schema.yaml
  files:
    - asset_manifest.yaml                              # 人工确认层（Source of Truth 语义覆盖）
    - asset_manifest.json                              # godot-art-assets 既有确认产物（合并读取）
  version: 1

# ---------- Planning / Composition ----------

feature_registry:
  schema: composition_schema.yaml
  index: feature_index.json                            # Generated Data
  discovery:
    cli: feature_registry/feature_discovery.py         # 发现：需求 -> features + 槽位 + 资产候选
    slots_config: entity_asset_slots.yaml              # 实体角色 -> 资源槽位（单一事实源）
    schema: feature_discovery_schema.yaml              # Discovery JSON 输出契约（Step 2.8 frozen）
    schema_version: 1                                  # 与 feature_discovery.SCHEMA_VERSION 一致
  capability_declaration:                              # Capability Producer（Phase 1.8.11）
    source: Features/<id>/feature.yaml                 # capabilities.required = Source of Truth（默认 []）
    reader: scene_composer/feature_capabilities.py     # 统一读取入口：只读、不判断、禁止推断
    transports_to: scene_intent.capabilities.required  # 经 Binding/Blueprint（template_loader 汇总）→ Intent
    validated_by: scene_composer/compatibility_gate.py # 能力可用性判定（Gate 只吃 Scene Intent）
    pipeline_test: scene_composer/tests/test_feature_capability_pipeline.py
    adoption:                                          # Phase 1.8.12：存量 Feature 数据迁移
      status: adopted                                  # 12 个 Feature 均已声明（Node / Collision）
      test: scene_composer/tests/test_feature_capability_adoption.py
      audit: 声明必须与 Feature 自身场景/契约一致（Node 恒有；Collision 需场景证据）
      baseline: 迁移后 .tscn / .gd 与迁移前逐字节相同
  discovery_to_binding:                                # Adapter（Phase 1.8.2 Step 2）
    cli: feature_registry/discovery_to_binding.py      # Discovery payload + --select -> --binding 输入
    input: feature_discovery_schema.yaml               # 只读 Discovery JSON（schema_version=1）
    output_kind: explicit_binding_override             # {bindings:[{role,asset}]}，可直接传
                                                       # bind_assets --binding FILE
    selection: --select SLOT=CANDIDATE_ID (repeatable) # 必须 explicit；绝不默认 top1
    exit_codes: {0: 转换成功（含部分成功+警告）, 1: 输入有效但无法明确绑定,
                 2: I/O 失败或结构错误}
    principles: feature_discovery_schema.yaml 头部 Contract Freeze 六原则
  version: 1

gameplay_blueprint:
  schema: gameplay_schema.yaml
  version: 1
  cli: gameplay_planner/planner.py                     # "<requirement>" [--id] [--out] [--emit-entities]
  entity_blueprints:                                   # Phase 1.9：Gameplay Blueprint -> 每实体 Entity Blueprint
    emitter: gameplay_planner/blueprint_generator.py    # entity_blueprints / write_entity_blueprints（唯一实现）
    cli_flag: --emit-entities <dir>                     # 写出 <entity_id>.yaml（planning 层，不生成场景）
    output_schema: scene_schema.yaml                    # 产物是 Entity Blueprint（Scene Composer 的合法输入）
    skips:                                              # 不产出的实体（不臆造事实）
      - 已声明 scene: 的复用实体（重生成会覆盖既有场景）
      - 无 features 的实体（check_gameplay 已报 Gameplay entity <id> has no features）
    consumer: scene_composer/scene_composer.py          # 逐实体生成场景
    boundary: scene_composer 不接受 Gameplay Blueprint（报 has no components）
    test: e2e/tests/test_end_to_end_generation.py       # A 段（+ G3/G4 闭环；
                                                       #  Phase 1.11 起含结构语义 G6b–G6d、
                                                       #  玩法断言 G10f–G10h、受控负向 G12）

level_orchestration:                                   # Phase 1.13 建立；Phase 1.20 增加 boss 模式；
                                                       # Phase 1.22 增加结构化诊断事件（只观测）
  schema: level_schema.yaml                            # 字段/合法值/默认值/校验规则（Source of Truth）
  version: 2                                           # v2 增加 mode/holdout/boss；v1 遗留 waves 配置仍有效
  cli: gameplay_planner/level_planner.py               # <gameplay.yaml> --out Levels/<id>.json
                                                       # [--waves N] [--wave-size N] [--wave "entity:count"]...
                                                       # boss：--mode boss --boss <entity> --plan <composition_plan.yaml>
                                                       # 多阶段：--stage clear:<entity>:<count> --stage boss [--stage complete]
  producer: gameplay_planner/level_planner.py          # build_level / build_boss_level / write_level（唯一实现）
  validation_impl: gameplay_planner/level_planner.py#validate_level   # producer 与 validator 共用
  validator: validator/check_level.py                  # 独立 CLI；validate.py --level 可编排同一实现（Phase 1.15）
  generated_data: Levels/<level_id>.json               # Generated Data（可按 producer 重建）
  format: json                                         # Godot 无 YAML 解析；运行时 FileAccess + JSON.parse_string
  runtime_impl: Orchestration/level_orchestrator.gd    # LevelOrchestrator：波次/生成/计数/出口/Boss/胜利（场景无关）
  config_impl: Orchestration/level_config.gd           # LevelConfig：解析 + 校验 + 归一化（镜像同一规则集）
  host_adapter: Orchestration/level_host.gd            # LevelHost：生成/组合宿主的通用适配（注入节点引用 + boss 绑定）
  modes:                                               # 同一实现服务三种编排语义
    waves:                                             # 顺序波次（Phase 1.13 语义，默认）
      adapter: Scenes/timed_combat_arena.gd            # 场景适配层：节点引用 + HUD 表现
      level: Levels/timed_combat_arena.json            # 发布配置（version 2, mode: waves）
    holdout:                                           # 生存坚守（持续生成调度 + 生存胜利）
      adapter: Scenes/survival_arena.gd                # 场景适配层：拾取物/陷阱/HUD/冻结
      level: Levels/survival_arena.json                # 发布配置（version 2, mode: holdout）
    boss:                                              # 单一显式 Boss（Phase 1.20）
      adapter: Scenes/boss_challenge.gd                # 场景适配层：HUD/表现/Boss 停摆（胜负归编排器）
      level: Levels/boss_challenge.json                # 发布配置（version 2, mode: boss）
      instance_source:
        - existing (boss.instance 显式点名)
        - on_start (从 entities[boss.entity].scene 生成)
      host_adapter: Orchestration/level_host.gd        # 无专属脚本的组合宿主由 LevelHost 接线
      multi_stage:                                     # Phase 1.21：可选 stages 显式阶段链
        stages: [clear_enemies, defeat_boss, "complete_level (optional terminal)"]
        order: stages 数组顺序（不按目录/节点遍历/名称匹配）
        events: stage_started / stage_completed / stages_completed（各恰好一次）
        instance_source: existing（跨契约校验）/ on_start（Boss 在 defeat_boss 阶段生成）
  legacy_path: Scenes/timed_combat_arena.gd#waves      # 手写 waves 仍兼容（level_config_path 留空时）
  legacy_holdout_path: Scenes/survival_arena.gd        # 遗留导出（survival_duration/spawn_interval/...）仍兼容
  resolver: "复用声明 scene: 优先，其次 Scenes/<Pascal>.tscn 生成约定"   # 只做存在性解析，不选资源不编造
  defaults:
    wave_duration: 30.0
    exit_unlock_when: all_waves_cleared
    victory_condition: exit_reached_after_unlock       # waves 默认；holdout 为 survive_duration
  supported_values:
    exit.unlock_when: [all_waves_cleared, never]       # 仅 waves
    exit.unlock_when_boss: [boss_defeated, never]      # 仅 boss
    victory.condition: [exit_reached_after_unlock, all_waves_cleared]   # 仅 waves
    victory.condition_holdout: [survive_duration]      # 仅 holdout
    victory.condition_boss: [boss_defeated, exit_reached_after_unlock]  # 仅 boss
  known_limits:                                        # 如实记录（不宣称为已支持）
    - holdout 无出口概念；顺序波次仅 waves 模式支持
    - boss 模式与 waves/holdout 互斥；多阶段 Boss 只在 stages 内组合，不复用 waves/holdout 块
    - stages 的 on_start Boss 不与 composition_plan 做实例交叉校验（运行时生成，无宿主实例）
    - 拾取物 / 陷阱 / 奖励机关由场景适配层管理，不纳入关卡编排配置
    - generator 产出 waves / boss 配置；holdout 配置为手工编写
  runtime_test: Tests/test_level_orchestration.gd       # L7–L15：配置驱动的生成/波次/出口/胜负（真实 Godot）
  generic_test: Tests/test_generic_level_orchestration.gd   # Phase 1.14：G1–G13 通用编排（真实 Godot）
  boss_test: Tests/test_boss_orchestration.gd          # B1–B5 Boss 生命周期 / 失败路径 / 接入；
                                                       #   B6 多阶段：清理→激活→击败→完成 / 提前死亡 / 幂等 / 非法配置
  unit_test: gameplay_planner/tests/test_level_planner.py   # L1–L9 校验（含 holdout/boss/版本兼容）；
                                                       #   L10 多阶段契约 + 生成；L11 交叉校验 + CLI
  cross_layer_test: validator/tests/test_cross_layer_contract.py  # Phase 1.15：C1–C8 同一正反例在
                                                       #   Python validate_level 与 Godot LevelConfig 两层判定一致；
                                                       #   C10 boss；C11 多阶段阶段链正反例
  pipeline_test: e2e/tests/test_end_to_end_generation.py    # K 段（生成物 + 生成配置 + 运行时）；
                                                       #   N 段（Phase 1.20 Boss）；P 段（Phase 1.21 多阶段）
  probe: e2e/level_orchestration_probe.py              # 生成配置的运行时消费探针（机读 LEVEL: 行）
  boss_probe: e2e/boss_level_probe.py                  # boss 生成链路探针（机读 BOSS: 行）
  stage_probe: e2e/multi_stage_boss_probe.py           # 多阶段生成链路探针（机读 STAGE: 行）；
                                                       # Phase 1.22 导入真实 trace → Tests/e2e_multi_stage_boss_trace.json
  diagnostics:                                         # Phase 1.22：结构化诊断事件（只观测生产状态机）
    schema: orchestration_trace_schema.yaml            # 事件契约 / reason 代码 / 回放规则（Source of Truth）
    schema_version: 1
    recorder: Orchestration/orchestration_trace.gd     # OrchestrationTrace：内存事件 + 严格序号 + JSON 导出
    producer: Orchestration/level_orchestrator.gd      # start/stage/boss/terminal/duplicate/invalid 真实边界写入
    export: Orchestration/level_orchestrator.gd#export_trace_json   # 显式路径；失败返回 false
    toggle: trace_enabled = false                      # 关闭后零事件且游戏行为不变
    runtime_test: Tests/test_orchestration_trace.gd    # T1–T8：契约/幂等/失败/关闭/导出/卸载/waves+holdout
    replay_impl: validator/trace_replay.py             # 只读回放器 + CLI（--json；不驱动游戏）
    replay_test: validator/tests/test_orchestration_trace.py   # R1–R80 人工序列契约用例
                                                # （R68–R80 = Phase 1.28 跨模式语义：模式门、
                                                # 阶段数一致性、终结 reason 白名单、mode 声明、
                                                # 三条合法链不被误拒、四个真实基线仍可回放）
                                                       # （R44+ 波次语义；R58+ 出口解锁前置；
                                                       # R62+ holdout 生成调度激活事件）
    e2e: e2e/tests/test_end_to_end_generation.py       # P14–P18：真实 trace → 独立回放 → 状态一致 /
                                                       #   确定性 / 去终结事件后为 playing / 临时 trace 清理
    boundary: "回放器不写入游戏；事件不是胜负/阶段转换的触发源（权威 = LevelOrchestrator）"

scene_composition:
  schema: scene_schema.yaml                            # Scene Blueprint / template.yaml 格式（不变）
  boundary_contract: scene_composer_schema.yaml        # Phase 1.8.3 建立；1.8.5 升级 Scene Intent 为一等概念；
                                                       # 1.8.7 收口消费边界（Scene Builder 只吃 Scene Intent）
  boundary_contract_version: 2                         # 与 scene_composer_schema.yaml schema.version 一致
  input: asset_binding_schema.yaml                     # 只读输入：Asset Binding 文档（schema_version=2）
  output: scene_intent                                 # 计划产物（plan_only）；本条目不授权 .tscn 生成
  output_contract:                                     # Scene Intent 定义位置（单一事实源，禁止第二份）
    schema: scene_composer_schema.yaml                 # 定义在 boundary_contract 的 scene_intent 段
    section: scene_intent
    version: 1                                         # 与 scene_intent.version 一致
    plan_only: true
    persistence: memory_only                           # 不落盘（Phase 1.8.5 决策）
    producer: scene_composer/scene_intent.py           # SceneIntentBuilder（Phase 1.8.6 物化）
    runtime_test: scene_composer/tests/test_scene_intent_runtime.py
    contract_test: scene_composer/tests/test_scene_intent_contract.py
    builder_input_test: scene_composer/tests/test_scene_builder_intent_input.py  # Phase 1.8.7
    validator_input_test: scene_composer/tests/test_scene_validator_intent_input.py  # Phase 1.8.8
    compatibility_gate_test: scene_composer/tests/test_scene_compatibility_gate.py   # Phase 1.8.9
    capability_test: scene_composer/tests/test_scene_intent_capability.py            # Phase 1.8.10
    capabilities: scene_intent.capabilities.required  # 能力声明字段（CURRENT，默认 []）
    capability_registry: scene_composer/capability_registry.py  # 能力词汇唯一事实源（v1）
    capability_producer: scene_composer/feature_capabilities.py  # Phase 1.8.11：Feature 声明读取入口
    capability_flow: scene_composer_schema.yaml#capability_declaration_flow  # 契约段（唯一事实源）
    capability_pipeline_test: scene_composer/tests/test_feature_capability_pipeline.py  # Phase 1.8.11
    capability_contract_test: scene_composer/tests/test_capability_contract_validator.py  # Phase 1.8.13
    component_instance: scene_composer/component_instance_resolver.py  # Phase 1.8.14：组件实例计划（证据供给）
    component_instance_test: scene_composer/tests/test_component_instance_materialization.py  # Phase 1.8.14
    artifact_evidence: scene_composer/artifact_evidence_validator.py   # Phase 1.8.15：生成物核验（声明 = 计划 = 生成物）
    artifact_evidence_test: scene_composer/tests/test_artifact_evidence_validator.py  # Phase 1.8.15
    external_artifact: scene_composer/external_artifact_resolver.py    # Phase 1.8.16：ExtResource → 组件场景（递归静态解析）
    external_artifact_test: scene_composer/tests/test_external_artifact_evidence.py   # Phase 1.8.16
    instance_ownership: scene_composer/component_instance_ownership.py # Phase 1.8.17：声明 → 产物实例节点（归属）
    instance_ownership_test: scene_composer/tests/test_component_instance_ownership.py  # Phase 1.8.17
    entity_root_instance: scene_composer/template_loader.py#attach.root_instance  # Phase 1.11：
                                                       # 成员入口场景即实体根（推导 root.scene）
    entity_root_instance_test: scene_composer/tests/test_entity_root_instance.py   # Phase 1.11
    attach_nodes: scene_composer/template_loader.py#attach.nodes  # Phase 1.11：组件自带结构节点
                                                       # （碰撞形状）→ Scene Intent nodes[]
    boundary_helpers: scene_composer/scene_intent.py   # intent_document / intent_components /
                                                       # intent_root / intent_from_blueprint（唯一实现）
  compatibility_gate:                                  # Phase 1.8.9：生成前闸门（Scene Intent → Gate → Builder）
    spec: scene_composer_schema.yaml#compatibility_gate  # 契约段（唯一事实源）
    module: scene_composer/compatibility_gate.py
    entrypoint: check_scene_compatibility(scene_intent)
    input: scene_intent
    legacy_input: rejected                             # 原始 Blueprint / 旧规整 dict → ValueError
    consumes: ["capabilities.required", "components[].component", "resources[].type"]
    capability_registry: scene_composer/capability_registry.py  # 能力词汇唯一事实源（Phase 1.8.10）
    runs_before: scene_builder
    status_vocabulary: [PASS, BLOCKED]
    blocked_behavior: zero_output                      # BLOCKED 时不得产生任何 .tscn
  cli: scene_composer/scene_composer.py                # <blueprint.yaml> --bind-assets --tests
  consumer:
    asset_nodes:
      module: scene_composer/asset_nodes.py            # Asset Binding -> 场景资源节点
    scene_builder:                                     # Phase 1.8.7：Scene Intent 是唯一输入
      module: scene_composer/scene_builder.py
      input: scene_intent
      legacy_input: rejected                           # 规整内部 dict 传入即 ValueError
      root_instance_rule: 入口场景 == root.scene 的组件不作为子节点实例化  # Phase 1.11
    scene_validator:                                   # Phase 1.8.8
      module: scene_composer/scene_validator.py
      input: scene_intent
      legacy_input: rejected
      rules_changed: false                             # 仅字段来源换位（features / root_type）
      root_instance_rule: 计划声明根实例时改判根实例，静态解析被引用场景根类型（缺根实例 / 重复子节点为失败）  # Phase 1.11
    test_generator:                                    # Phase 1.8.8
      module: test_generator/generate_scene_test.py
      input: scene_intent
      legacy_input: rejected
      raw_blueprint_entry: intent_from_blueprint       # 仅 CLI 入口做 Blueprint → Intent
    check_scene_composition:                           # Phase 1.8.8（CLI 入口仍是原始 Blueprint）
      module: validator/check_scene_composition.py
      transition: intent_from_blueprint -> validate_scene(scene_intent)
    compatibility_gate:                                # Phase 1.8.9
      module: scene_composer/compatibility_gate.py
      input: scene_intent
      legacy_input: rejected
      runs_before: scene_builder
    capability_contract:                               # Phase 1.8.13（fulfillment 层）
      spec: scene_composer_schema.yaml#capability_contract_validation
      module: scene_composer/capability_contract_validator.py
      contracts: scene_composer/capability_contracts.py  # capability → requirement（唯一事实源）
      entrypoint: validate_capability_contract(scene_intent, scene_plan=None)
      input: scene_intent
      evidence: scene_plan                             # Intent 投影；不解析 .tscn
      evidence_priority: ["components[].instance", "nodes[]", root]   # Phase 1.8.14
      consumes: capabilities.required
      runs_after: compatibility_gate
      runs_before: scene_builder
      blocked_behavior: zero_output
    component_instance:                                # Phase 1.8.14（证据供给层）
      spec: scene_composer_schema.yaml#component_instance_materialization
      module: scene_composer/component_instance_resolver.py
      entrypoints: [resolve_component_instances(scene_intent),
                    resolve_component_instance_report(scene_intent)]
      input: scene_intent
      transport: template_loader.normalize_scene_blueprint   # Feature template.yaml instance: /
                                                           # Blueprint components[].instance → Intent
      consumes: ["components[].instance"]               # 声明式证据；不驱动生成
      generator_impact: none                           # Builder 不读它，.tscn 输出不变
      no_inference: true                               # 静态词表；未识别 → BLOCKED
      consumed_by: scene_composer/capability_contract_validator.py
      verified_by: scene_composer/artifact_evidence_validator.py   # Phase 1.8.15：生成物核对
      ownership: scene_composer/component_instance_ownership.py    # Phase 1.8.17：instance.id → 实例节点
      test: scene_composer/tests/test_component_instance_materialization.py
    artifact_evidence:                                 # Phase 1.8.15（生成后核验层）
      spec: scene_composer_schema.yaml#artifact_evidence_validation
      module: scene_composer/artifact_evidence_validator.py
      entrypoint: verify_artifact_evidence(scene_intent, scene_path, project_root=None)
      input: [scene_intent, scene_path]                # 生成物路径：写盘之后
      evidence: .tscn                                  # 静态文本：name / type / parent / ExtResource
      static_only: true                                # 不启动 Godot、不加载 PackedScene
      consumes: ["components[].instance"]              # 声明必须能在产物里找到
      evidence_priority: ["components[].instance", "owner artifact (+ reachable closure)", host_nodes]
                                                       # Phase 1.8.17：证据池按归属限定
      ownership: scene_composer/component_instance_ownership.py    # 归属先于结构核对
      runs_after: scene_builder                        # 与 scene_validator 同阶段（写盘后）
      keeps_artifact_on_failure: true                  # 不删除、不自动修复（供诊断）
      blocked_behavior: report_only                    # ok=false + failures 前缀 "Artifact Evidence: "
      report_fields: [status, errors, checked_instances, checked_external_artifacts,
                      checked_ownership]               # 第 4 键 1.8.16 / 第 5 键 1.8.17 追加
      test: scene_composer/tests/test_artifact_evidence_validator.py
    external_artifact:                                 # Phase 1.8.16（外部证据供给）
      spec: scene_composer_schema.yaml#external_artifact_evidence
      module: scene_composer/external_artifact_resolver.py
      entrypoints: [resolve_external_artifact(scene_path, resource_path),
                    resolve_external_artifacts(scene_path)]
      input: [scene_path, resource_path]               # res://Features/<id>/<scene>.tscn
      recursive_static_parse: true                     # 嵌套引用递归；纯静态文本
      no_runtime: true                                 # 不启动 Godot、不加载 PackedScene
      resolves: res://Features/**/*.tscn               # 仅 PackedScene + Features 路径
      cycle_guard: true                                # 祖先链 → recursion detected（菱形引用不是环，1.37）
      consumes: ext_resource_table                       # type / path / id（资源类引用不解析）
      references_graph: true                           # {res://: [直接引用]}（1.8.16 返回；1.8.17 归属闭包消费）
      consumed_by: scene_composer/artifact_evidence_validator.py
      generator_impact: none                           # 只读 .tscn，不改 Builder / 产物
      test: scene_composer/tests/test_external_artifact_evidence.py
    component_instance_ownership:                      # Phase 1.8.17（归属层）
      spec: scene_composer_schema.yaml#component_instance_ownership
      module: scene_composer/component_instance_ownership.py
      entrypoint: resolve_component_ownership(scene_intent, artifact_evidence)
      input: [scene_intent, artifact_evidence]          # 宿主产物静态解析结果（含 scene_path）
      ownership_source: ["components[].instance.id", "ext_resource path", "node instance=ExtResource()"]
      output: "{status: PASS|BLOCKED, owners: [{component, artifact_path, node_path, confidence}], errors}"
      confidence: [declared, resolved]
      ambiguity_behavior: blocked                      # 不猜测：id 0/≥2 命中、无 id 多候选 → BLOCKED
      blocked_message: "Component ownership unresolved: <component>"
      runs_before: artifact_evidence_validation        # 归属失败即停，不再进入结构核对
      generator_impact: none                           # 只读映射，不改 Builder / 产物
      consumed_by: scene_composer/artifact_evidence_validator.py
      no_inference: true                               # 不按名字 / 关键词 / Registry 推断
      test: scene_composer/tests/test_component_instance_ownership.py
  instance_evidence:                                 # Phase 1.38（声明 ↔ 真实 .tscn 对账）
    spec: scene_composer_schema.yaml#feature_instance_evidence_reconciliation
    module: scene_composer/instance_evidence.py
    entrypoints: [reconcile_declaration(declaration, scene_path),
                  reconcile_feature(feature, features_dir),
                  reconcile_component_mounts(scene_path, feature_ids)]
    input: [Features/<id>/template.yaml#instance, Features/<id>/<entry>.tscn]
    evidence_model: [declaration, static_scene, runtime]   # 三级证据不得互相顶替
    status: [PASS, MISMATCH, INSUFFICIENT, INVALID, NOT_DECLARED]
    independent_of_generator: true                   # 不复用 Scene Intent / 生成器预期对象
    static_only: true                                # 文本解析；不启动 Godot
    runtime_gap: INSUFFICIENT                        # 动态节点只能靠运行时证据
    validator_stage: 7                               # validator/check_instance_evidence.py
    cli: "scene_composer/instance_evidence.py --feature <id> | --all | --blueprint+--scene"
    generator_impact: none
    test: scene_composer/tests/test_instance_evidence_reconciliation.py
  runtime_instance_evidence:                         # Phase 1.39（真实 Godot 加载后的对象树）
    spec: scene_composer_schema.yaml#runtime_instance_evidence
    module: scene_composer/runtime_instance_evidence.py
    probe: scene_composer/probes/instance_runtime_probe.gd   # extends SceneTree，-s 运行
    entrypoints: [verify_feature(feature), verify_all(), declared_features(),
                  build_contract(feature), run_probe(contract), judge(observation)]
    input: [Features/<id>/template.yaml#instance.runtime, Features/<id>/<entry>.tscn]
    evidence_model: [file_parsed, resource_loaded, node_exists]      # behavior 不在本层
    status: [PASS, MISMATCH, INSUFFICIENT, INVALID, NOT_DECLARED]
    timing: [after_load, after_frames:<N>, after_action:<name>]
    action_policy: 不自动触发游戏动作 → after_action 直接 INSUFFICIENT
    timeout_semantics: 窗口内未出现 ≠ 已证明永不存在
    evidence_dir: .ai/tmp/runtime-instance/<run_id>/   # contract/result/stdout/stderr
    validator_flag: "--instance-runtime <feature|all> [--require-runtime]"
    default_gate: 静态 Validator 不启动 Godot；INSUFFICIENT → warning，--require-runtime → failure
    test: scene_composer/tests/test_runtime_instance_evidence.py
  feature_behavior_evidence:                         # Phase 1.40（真实动作后的行为证据）
    spec: scene_composer_schema.yaml#feature_behavior_evidence
    module: scene_composer/feature_behavior_evidence.py
    probe: scene_composer/probes/feature_behavior_probe.gd   # extends SceneTree，-s 运行
    entrypoints: [verify_feature(feature), verify_contract(contract, project), declared_features(),
                  build_contracts(feature), run_probe(contract, project), judge(observation)]
    input: [Features/<id>/template.yaml#behavior, Features/<id>/<entry>.tscn]
    evidence_model: [action_executed, postcondition_observed, replay_consistent]  # 结构证据不能顶替
    status: [PASS, MISMATCH, INSUFFICIENT, INVALID, NOT_DECLARED]
    protocol: context/behavior_protocol.yaml            # Phase 1.41：动作/观测能力唯一权威
    manifest: scene_composer/probes/behavior_manifest.json   # 协议生成物；探针只读
    actions: [door.set_open, health.take_damage, health.heal, physics.overlap,   # 由协议声明
              simulation.advance_frames, state.set_property, input.press, input.release]
    checks: [door.is_open, health.current, health.is_dead, pickup.is_collected, node.freed,
             node.exists, trigger.is_triggered, gate.is_fulfilled, health_bar.ratio,
             node2d.position, node2d.displacement, signal]   # health_bar.ratio = Phase 1.50 只读
    action_policy: 受控动作 + 真实物理接触 + 真实 physics 帧；不执行任意方法名/表达式，不直接改被测状态
    fixtures: "state.set_property 只能写协议 properties: 白名单；必须排在行为动作之前；单契约 ≤ 4"
    frame_budget: "单次 ≤ 300；单契约（推进 + window_frames）≤ 600（协议 limits，两端共用）"
    replay: 默认 2 次；比较关键结果（忽略帧号/时长）；不一致 → INSUFFICIENT
    isolation: .ai/tmp/behavior/workspace-*/project（Features 副本；本次运行拥有并删除）
    evidence_dir: .ai/tmp/behavior/<run_id>/   # contract/result/stdout/stderr
    cli: "feature_behavior_evidence.py --feature <id> | --all [--require-behavior] [--json] [--replay N]"
    default_gate: 独立 CLI；静态 Validator 不启动 Godot；INSUFFICIENT → warning，--require-behavior → failure
    protocol_gate: 协议非法 / manifest 漂移 / 探针实现缺失 → failure（退出 1，不降级）
    test: scene_composer/tests/test_feature_behavior_evidence.py
    test_time_driven: scene_composer/tests/test_behavior_time_driven.py   # Phase 1.42
    test_chase: scene_composer/tests/test_chase_movement_behavior.py      # Phase 1.43（behavior[].scene）
    test_condition_gate: scene_composer/tests/test_condition_gate_behavior.py   # Phase 1.44（条件门控：真实接触 → 聚合 → 下游）
    test_contact_damage: scene_composer/tests/test_contact_damage_behavior.py   # Phase 1.47（真实接触伤害 / 伤害量 / 无接触不伤）
    test_stun: scene_composer/tests/test_stun_behavior.py   # Phase 1.49（受击→物理停摆 / 到点恢复 / 治疗豁免 / 死亡守卫 / 幂等广播）
    test_health_bar: scene_composer/tests/test_health_bar_behavior.py   # Phase 1.50（真实 Health 变化 → 血条显示比例；只读观测 health_bar.ratio）
    test_health: scene_composer/tests/test_health_behavior.py   # Phase 1.51（健康契约的缺陷检出能力：9 类注入，8 类被检出 / 1 类记录为缺口）
  behavior_protocol:                                 # Phase 1.41（动作/观测能力的唯一定义）
    file: context/behavior_protocol.yaml             # 人写权威；不描述任何 Feature 预期结果
    loader: scene_composer/behavior_protocol.py
    generated: scene_composer/probes/behavior_manifest.json   # 只读运行时清单
    entrypoints: [load_protocol(path), check_manifest(protocol), write_manifest(protocol),
                  probe_capabilities(project_root, godot), check_capabilities(protocol, caps),
                  sequence_errors(actions), frame_budget_errors(actions, window_frames)]
    protocol_version: 2                              # v2 = 帧推进 / 受限状态设置 / 时间观测
    sections: [targets, limits, actions, observations, signals, properties]
    strictness: 重复 ID / 未知类型 / 未知目标 / 非法引用 / 版本不兼容 / 未实现项 → 拒绝
    fail_closed: 缺失 / 损坏 / 漂移 → INVALID 或退出 1；不降级为宽松模式
    source_of_truth: 探针只保留实现 ID → 内部方法映射；不另存动作/观测定义
    test: scene_composer/tests/test_behavior_protocol_consistency.py
  composite_behavior_evidence:                       # Phase 1.46（组合场景端到端链）
    spec: scene_composer_schema.yaml#composite_behavior_evidence
    module: scene_composer/composite_behavior_evidence.py
    probe: scene_composer/probes/composite_behavior_probe.gd   # extends SceneTree，-s 运行
    entrypoints: [verify_scene(scene_id), verify_contract(contract, project), declared_scenes(),
                  summarize(reports), CompositeWorkspace(run_id, godot)]
    input: [context/composite_scenes/<scene_id>.yaml, Scenes/<scene>.tscn]
    why: "behavior[].scene 只允许 Features/<f>/ 内路径；组合链属于场景而非 Feature，形状是分阶段链"
    evidence_model: [stage_action_executed, stage_postcondition_observed, all_stages_completed, replay_consistent]
    status: [PASS, MISMATCH, INSUFFICIENT, INVALID]
    protocol: context/composite_behavior_protocol.yaml   # 场景白名单 / 阶段预算 / 禁止动作
    protocol_extends: context/behavior_protocol.yaml v2  # 动作/观测能力的唯一权威仍是共享协议
    manifest: scene_composer/probes/composite_behavior_manifest.json   # 协议生成物；探针只读
    scenes: [escape_room, slime_contact, survival_arena]   # 受约束的场景资源路径白名单
    stage_policy: 2..8 段；每段 actions + expected + window_frames；阶段边界即事件顺序证据
    frame_budget: "单段窗口 ≤ 120；整链（推进 + 全部窗口）≤ 1200"
    denied_actions: [state.set_property]                 # 不允许夹具写状态冒充组件交互
    replay: 默认 2 次；比较阶段状态与每条 check；不一致 → INSUFFICIENT
    ownership: .ai/tmp/composite/workspaces/<run_id>/（owner.json + 独占创建；非本运行目录只报告不删除）
    evidence_dir: .ai/tmp/composite/<run_id>/            # contract/result/stdout/stderr
    cli: "composite_behavior_evidence.py --scene <id> | --all [--require-composite] [--json] [--replay N]"
    default_gate: 独立 CLI；静态 Validator 不启动 Godot；INSUFFICIENT → warning，--require-composite → failure
    protocol_gate: 协议非法 / manifest 漂移 / 探针能力缺失 → failure（退出 1，不降级）
    test: scene_composer/tests/test_composite_behavior_evidence.py
    test_slime_contact: scene_composer/tests/test_slime_contact_arena.py   # Phase 1.48（玩家 → 史莱姆接触 → 玩家 Health 端到端）
  composite_behavior_protocol:                       # Phase 1.46（组合场景协议）
    file: context/composite_behavior_protocol.yaml    # 人写权威；只增加场景/阶段预算/禁止动作
    loader: scene_composer/composite_behavior_protocol.py
    generated: scene_composer/probes/composite_behavior_manifest.json   # 只读运行时清单
    entrypoints: [load_protocol(path), check_manifest(protocol), write_manifest(protocol),
                  build_contracts(dir, protocol, behavior), probe_capabilities(project_root, godot),
                  check_capabilities(protocol, behavior, caps)]
    protocol_version: 1
    sections: [extends, scenes, limits, denied_actions]
    strictness: 未知场景 / 路径越界 / 未知禁止动作 / 预算非法 / extends 版本不符 / 重复键 → 拒绝
    test: scene_composer/tests/test_composite_behavior_evidence.py
  version: 1


# ---------- Validation ----------

validator:
  entrypoint: validator/validate.py                    # 实际执行链：Framework→SkillRegistry→Project→Feature→Asset→BindingSchema→InstanceEvidence
                                                       # + Layer Checks（Phase 1.15：按 flag 编排下列各层，缺省不执行）
  integrated_stages:                                   # validate.py 内真正调用的阶段
    - validator/check_assets.py                        # Asset Validation（路径/类型/绑定/同步）
    - asset_registry/check_binding_schema.py           # Binding Schema Validation
    - validator/check_instance_evidence.py             # Feature Instance Evidence（Phase 1.38：声明 ↔ 真实 .tscn）
  layer_checks:                                        # Phase 1.15：validate.py 以编排器方式调用既有检查器
    orchestrator: validator/unified.py                 # run_layers / 结构化诊断 {layer,code,severity,location,path,reason,hint}
                                                       # 稳定错误代码；Runtime 层 Godot 缺失 → unavailable（INCOMPLETE，非零退出）
    flags:                                             # 各层显式 opt-in（缺省不执行，行为兼容）
      - "--scene-blueprint <yaml>"                     # → check_scene_composition（场景缺省按 root.name 推导）
      - "--gameplay-blueprint <yaml>"                  # → check_gameplay
      - "--level <json>"                               # → check_level（level_planner.validate_level）
      - "--level-plan <yaml>"                          # 与对应 --level 位置配对；启用 LevelConfig ↔ composition_plan 交叉校验
      - "--runtime-scene <res://...>"                  # → check_runtime + run_scene（真实 Godot headless，耗时）
      - "--runtime-result <json>"                      # → check_runtime（只判定既有结果，不启动 Godot）
      - "--instance-runtime <feature|all>"              # → runtime_instance_evidence（Phase 1.39；真实 Godot 加载，慢，缺省不执行）
      - "--require-runtime"                            # → 上述运行时实例证据的 INSUFFICIENT 视为 failure（最终验收）
    test: validator/tests/test_unified_validator.py    # C10：汇总/稳定代码/不可用语义
  standalone_stages:                                   # 独立 CLI（仍可单独运行；Layer Checks 编排同一实现）
    - validator/check_instance_evidence.py             # Feature Instance Evidence（Phase 1.38；exit 1 = MISMATCH/INVALID）
    - scene_composer/feature_behavior_evidence.py      # Feature Behavior Evidence（Phase 1.40；真实动作 + 后置断言；
                                                       #   exit 1 = MISMATCH/INVALID，--require-behavior 时含 INSUFFICIENT）
    - scene_composer/composite_behavior_evidence.py    # Composite Scene Behavior Evidence（Phase 1.46；分阶段真实运行时链；
                                                       #   exit 1 = MISMATCH/INVALID，--require-composite 时含 INSUFFICIENT）
    - validator/check_scene_composition.py             # Scene Validation
    - validator/check_gameplay.py                      # Gameplay Validation
    - validator/check_level.py                         # Level Orchestration Validation（Phase 1.13）；
                                                       #   --plan 启用交叉校验（Phase 1.21）
    - validator/check_runtime.py                       # Runtime Validation
  contract: 只 CHECK/REPORT；修复归 runtime/self_repair.py，修改资源属人工权限
  version: 2                                           # Phase 1.15：+Layer Checks 编排与统一诊断

# ---------- 测试执行入口（Phase 1.29 证据完整性） ----------

test_runner:
  entrypoint: run_tests.py                             # 全量/分段入口；阶段 1.26 起区分 PASS / FAIL / INCOMPLETE
  classification:                                      # Phase 1.29：PASS 要求「退出码 0 且未自报 SKIP」
    PASS: 退出码 0 且输出中没有 `SKIP:`（实际执行过全部断言）
    FAIL: 退出码非 0 且有失败标记（FAIL / FAILED / Traceback / SCRIPT ERROR）
    INCOMPLETE: 未执行 / 中断 / 超时 / 无任何报告即退出，或自报 `SKIP:`（依赖不可用）
    why: >-
      修复前实测 classify(0, "SKIP: …\nPASS: …") = PASS，而 e2e 集成套件在 Godot 缺失时
      会跳过 T4–T12（黄金基线捕获与比较整段）仍返回 0 ⇒ 未执行的段会被汇总成 passed；
      `--python-only` 下 unavailable 恒为空，甚至可输出 ALL PASS（exit 0）。
  exit_codes: 0 = 全 PASS；1 = 存在 FAIL / INCOMPLETE / unavailable / 未执行；2 = 仅 --godot-only 缺 Godot
  report: "completed/passed/failed/incomplete/unavailable/not_executed + 逐项状态与退出码"
  test: validator/tests/test_run_tests_evidence.py     # E1–E7：分类四态 + 真实 run_python_test 路径 + main() 空选择
  evidence: >-
    GDScript 测试中途 SCRIPT ERROR 实测不会静默 quit(0)（进程挂住 → 超时 → INCOMPLETE）；
    GDScript 测试中不存在 SKIP 字样，故该收紧对 Godot 侧零影响。
  run_workspace:                                     # Phase 1.32（F4）：每次运行专属工作区 + 所有权清理
    module: testsupport/run_workspace.py             # 标准库实现；不驱动 Godot
    contract: >-
      运行根 = .ai/tmp/runs/<pid>-<uuid8>/（mkdir exist_ok=False，已存在即拒绝接管）；
      ownership.jsonl 追加式记录 created/removed（含 sha256/bytes/mtime_ns）；
      清理只删账本中「token 匹配、路径在运行根内、非符号链接、size/mtime/sha256 一致」的文件；
      账本缺失/损坏/字段非法 ⇒ 整次清理拒绝；运行根仅在全部文件已入账并验证后 rmtree；
      其他 token 的残留只报告（stale_entries），reclaim_abandoned 必须显式确认且重新验账。
    test: validator/tests/test_run_workspace.py      # W1–W24 + L1–L8（37 项：隔离 / 幂等 / 篡改 / 越界 / 符号链接 /
                                                     # 未入账 / 异常退出残留 / 两进程并发 / 失败诊断 /
                                                     # 删除前再校验 / 账本中断行 / token 冲突 / GDScript 静态锁定 /
                                                     # token 格式统一 / e2e 串行锁）
    owner_test: validator/tests/test_e2e_ownership.py  # E1–E4：e2e 清单 / 内容签名 / 删除原语三个接缝
    consumer: validator/tests/test_cross_layer_contract.py  # 夹具与探针移入运行根；清理断言改为所有权验证
    consumer2: tools/e2e/tests/test_end_to_end_generation.py # 清单 + 启动期签名 + 本次运行缺席证明（固定名产物不迁出）
    gdscript_roots: Tests/*.gd                      # 6 个测试写 user://.test_runs/runs/<pid>-<16hex>/，只删本运行自有文件
    gitignore: .ai/tmp/                              # 易失工作区，不承载源码/文档
    not_done: F5（过滤命中数）与 janitor CLI 仍未实施，需要独立授权


gdscript_test_per_run_workspace:                       # Phase 1.33/1.34：GD 侧运行根（与 Python 同一契约）
  phase: "1.33 / 1.34"
  module: Tests/test_{generic_level_orchestration,level_orchestration,boss_orchestration,orchestration_trace,holdout_trace,waves_exit_gate}.gd
  contract: >-
    每个 GDScript 测试自行创建 .ai/tmp/runs/<pid>-<16 位十六进制随机后缀>/（与 Python
    run_workspace 的 canonical TOKEN_RE 同一格式；目录已存在 = 标识冲突，拒绝接管并重试）。
    临时关卡 JSON 与导出 trace 一律写入该目录；清理只删「本运行写入且内容未变」的文件；
    res://Levels / user:// 中前缀命中但不属于本运行的残留只报告不删除（fail-closed）。
    共享场景/配置只读不写；运行根在成功路径移除，失败时保留可诊断。GD 运行根无账本，
    stale_entries 报 "no ledger"，reclaim 拒绝（所有权不可证）。
  test: validator/tests/test_run_workspace.py::W19     # 静态锁定：不再写共享 Levels/user://
  consumer: tools/e2e/tests/test_end_to_end_generation.py
  not_done: >-
    .godot/ 引擎缓存未隔离（并发导入竞争仅评估未消除）；user://runtime-fixture-* 历史
    夹具所有权不可证，保留（L-10）。


# ---------- Runtime ----------

runtime_playtest:
  contract_config: ../config/runtime-playtest.yaml     # 默认超时/max_repair_attempts/安全边界
  runner: runtime/run_scene.py
  runtime_result_schema: runtime_result_schema.yaml
  version: 1

orchestration_trace:                                   # Phase 1.22：诊断事件与只读回放（定义见 level_orchestration.diagnostics）
  schema: orchestration_trace_schema.yaml
  schema_version: 1
  replay_cli: validator/trace_replay.py
  exit_codes: {0: valid, 1: contract_violation, 2: input_error}
  golden_baselines:                                    # Phase 1.23：黄金 Trace 基线与回归判定
    baseline_dir: .ai/tools/validator/baselines        # <scenario_id>.json（版本控制内，逐事件 = 真实 Godot trace）
    baseline_schema_version: 1                         # 与 trace schema_version 显式互检（不匹配 = 拒绝）
    scenarios: [multi_stage_boss, single_stage_boss, waves, holdout]
                                                       # waves = v2（Phase 1.25 波次语义事件：
                                                       # wave_started/wave_cleared/exit_unlocked，
                                                       # 7 事件链）；holdout = v2（Phase 1.27：
                                                       # spawn_schedule_started，3 事件链）；
                                                       # boss 保持 v1；schema v1 加性扩展
                                                       # （旧 trace 仍可回放；与 v2 基线比较会报
                                                       # EVENT_MISSING = 预期的行为变更信号）
                                                       # 覆盖：Boss 单/多阶段 + waves（清波→出口→Victory）
                                                       # + holdout（持续生成→survive_duration Victory）；
                                                       # 全部来自真实 Godot 沙箱捕获 + 显式批准（Phase 1.24）
    comparator: validator/trace_baselines.py           # 只读比较器 + CLI（先回放后比较；不排序、不只比数量）
    comparator_cli: "python .ai/tools/validator/trace_baselines.py <trace.json> --scenario <id> [--json]"
    exit_codes: {0: PASS, 1: REGRESSION/INCOMPLETE/INVALID_TRACE, 2: BASELINE_MISSING/INVALID_BASELINE}
    dynamic_fields: {ignored_event_fields: [run_id, timestamp_ms]}   # 显式策略；data 默认 strict
    approval_flow: e2e/approve_trace_baselines.py      # candidate → review → apply --i-approve（测试绝不写基线）；
                                                       # Phase 1.24：review/apply 都从候选**文件内容**重算指纹并与
                                                       # 记录指纹比对（篡改/替换候选 = 拒绝，exit 1，基线不动）；
                                                       # apply 原子写入（同目录 tmp + os.replace，不留半写入文件）
    fingerprint_scheme: {1: "Phase 1.23（含 scenario_id，历史基线）", 2: "Phase 1.24+（不含 scenario_id，当前）"}
                                                       # Phase 1.26：方案版本化；候选记录
                                                       # approval.candidate_fingerprint_scheme，
                                                       # 历史文件按方案集合逐个验算（U66/U67）
    candidates: "候选只来自真实 Godot 捕获（e2e/trace_baseline_capture.py，沙箱内完整生成链路）"
    e2e: e2e/tests/test_end_to_end_generation.py       # T 段 T1–T14（真实捕获 + 逐事件比较 + 差异注入）
    unit_test: validator/tests/test_trace_baselines.py # U1–U99（比较器/策略/批准流程/异常输入/
                                                       # 已批准基线的真实事件链 + 指纹可追溯性；
                                                       # U77–U85 = Phase 1.28 跨模式一致的拒绝理由、
                                                       # U86–U94 = Phase 1.29 审批信任边界（方案必须
                                                       # 声明、身份一致、输入错误统一、退出码锁定）、
                                                       # U95–U99 = Phase 1.30 证据来源一致性（校验不改
                                                       # 写输入 / run_id 与计数绑定 / 写入后保留真 run_id）、
                                                       # 非法基线 → INVALID_BASELINE、黄金集合无跨模式泄漏）
    cross_mode_semantics:                              # Phase 1.28：公共语义 vs 模式特有语义
      public: 结构/序号/时间戳契约、started 唯一居首且 data.mode 显式、终结互斥且之后只允许
        duplicate_event_ignored、非法序列的稳定 reason + 退出码
      mode_scope: stage_* → boss（且需声明阶段数）；boss_death_confirmed → boss；
        wave_started/wave_cleared/exit_unlocked → waves；spawn_schedule_started → holdout
      new_reasons: [invalid_start_mode, stage_event_outside_boss_stages,
                    stage_start_outside_declared_count, victory_reason_outside_mode,
                    failure_reason_outside_mode]
      terminal_reason_scope: 取值来自 LevelOrchestrator 实际写入点；boss 胜利只能 boss_defeated/forced；
        waves 胜利 exit_reached_after_unlock/all_waves_cleared/forced；holdout 胜利 survive_duration/forced；
        失败共有 player_died/setup_failed/forced，wave_timeout 仅 waves
      baseline_contract: validate_baseline 结构校验通过后必须回放事件（"events must replay:"）——
        结构合法但语义不合法的基线 → INVALID_BASELINE（exit 2），不把责任推给真实 trace
      baseline_impact: 无重录；四个基线事件字节未变，仍可回放且自比较 PASS（U84 守护）
    coverage_note: >-
      waves 基线的 coverage 声明自 Phase 1.26 起只描述真实事件链（事件级保护），探针度量
      断言单独列出——不得再出现「trace 不含波次事件」这类与 v2 内容矛盾的旧文案（U65 守护）。
    exit_gate_test: Tests/test_waves_exit_gate.gd      # Phase 1.26：出口锁定不得胜利的真实 Godot 注入（G1–G7）
    holdout_trace_test: Tests/test_holdout_trace.gd    # Phase 1.27：holdout 生成调度激活 / 提前失败 /
                                                       # 终结后重复（H1–H7；事件经生产导出接口读取）
    holdout_probe_evidence: "probe_metrics.trace_events 由导出 trace 文档统计（Phase 1.27 修正：
      此前 GDScript 侧恒报 0，与 trace_event_count 矛盾）"
    input_class_mapping:                               # Phase 1.29 M3：跨入口退出码映射已锁定
      trace_unreadable: {trace_replay: 2, trace_baselines: "INVALID_TRACE (1)"}
      baseline_missing: {trace_baselines: "BASELINE_MISSING (2)"}
      baseline_unreadable_or_invalid: {trace_baselines: "INVALID_BASELINE (2)"}
      note: >-
        同一「文件不存在」在两个入口的码不同，均已文档化并用 U91–U93 锁定；两者均非 0，
        输入问题永远不会变成 PASS。不得为“统一码”而静默改变任一入口行为。
    approval_boundary:                                 # Phase 1.29：审批入口信任边界
      new_candidate_scheme_required: 缺少 candidate_fingerprint_scheme 或声明 scheme 1 的新候选
        review/apply 一律拒绝（exit 1）——scheme 1 仅用于验证历史已批准基线
      identity_check: "--scenario 必须与候选内容 scenario_id 一致（否则 exit 2）；写入目标始终跟随内容"
      candidate_resolution: "--candidate <文件> --scenario <id> 按文件处理（修正此前被当成目录拼接的路径缺陷）"
      unreadable_candidate: 不可读 / 非 JSON / 非对象 → review 与 apply 同为 exit 2 + 同一诊断
      provenance_consistency:                          # Phase 1.30（E-1/E-2）
        validator_does_not_mutate: 校验只在事件**副本**上规范化 run_id；apply 写入的基线保留真实
          run_id（旧实现把 candidate-check 写进正式基线，毁掉来源线索；U95/U99）
        run_binding: "source.trace_run_id 必须非空且等于每个事件的 run_id（U96/U97）"
        count_binding: "source.trace_event_count（存在时）必须等于事件数（U98，含截断捕获）"
        note: >-
          一致性 ≠ 来源真实性：两字段在同一文件里可被一起改写，指纹无密钥，--i-approve 无身份
          认证。历史四个基线的 run_id 已被旧校验器覆写且禁止重录，修复只对此后候选生效。
      tests: "validator/tests/test_trace_baselines.py U86–U99（异常路径 + 正向对照 + 候选→审查→批准闭环 +
        证据来源一致性）"

runtime_diagnosis:
  cli: runtime/diagnose_runtime.py
  repair_plan_schema: repair_plan_schema.yaml
  version: 1

runtime_self_repair:
  cli: runtime/self_repair.py
  asset_repair: runtime/asset_repair.py                # domain=asset 分支（max_repair_attempts 约束内）
  history_dir: ../memory/runtime-repairs               # Generated Data；独立于 DECISIONS.md
  version: 1

# ---------- Evaluation（Phase 1.36）----------

evaluation:
  cli: evaluation/runner.py                            # --list / --task <id|all> / --json
  tasks: evaluation/tasks.yaml                         # 当前任务集 v2（Phase 1.37）
  tasks_v1: evaluation/tasks.phase136.yaml             # Phase 1.36 冻结副本（对照基线，勿改）
  scoring: evaluation/scoring.py                       # 判定与指标口径唯一事实源
  contract: >-
    任务 = 需求 + attempts（initial / plan_revision / framework；expect_failure 证伪尝试
    不算通过且不结束尝试链）+ verify（真实 Godot 探针 + 受控负向 + 既有测试回归）；
    阶段 = plan/artifacts/loadable/behavior/negative/regression，任一 FAIL 即 FAIL、
    无证据 = NOT_EXECUTED；任务 PASS 要求 required_phases 全部 PASS（未执行不算通过）。
    指标分母显式：first_pass/final_pass 以已尝试任务数为分母，auto_repair 只统计
    framework 尝试，cost 无计量入口时记 UNAVAILABLE。
  ownership: >-
    产物路径必须在运行前不存在；清理只删账本内且内容标记匹配者（.gd/.yaml → EVAL136、
    .tscn → Eval136Marker 节点、关卡 JSON → level.id）；标记不匹配或目录在运行目录之外
    ⇒ 拒绝删除并使本次运行退出码为 1；.gd.uid 仅在源文件由本次运行创建时删除。
  probes: evaluation/probes/                           # 运行时行为断言（非节点存在性）
  test: evaluation/tests/test_evaluation_scoring.py    # 28 checks
  test2: evaluation/tests/test_evaluation_runner.py    # 24 checks
  evidence: ../../.ai/tmp/eval/<token>/report.json     # 易失；.ai/tmp/ 已在 .gitignore
  report: PHASE_1_37_AUDIT.md
  report_prev: PHASE_1_36_AUDIT.md
  phase_1_37: >-
    T1 的 expect_failure 尝试退役（单 Feature 已可生成，见 PHASE_1_37_AUDIT.md §3）；
    评分逻辑未改。v1/v2 首次通过率不可直接混算，对照时须显式标注任务集版本。
  not_done: 成本/模型计量、并行评估、T3 独立 artifacts 阶段、D3（--waves 被忽略）
            （详见 PHASE_1_37_AUDIT.md §7）

