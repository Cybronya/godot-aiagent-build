# Scene Blueprint Schema
# 定义 Scene Composer 的输入格式（scene_composer.py 读取）与生成约定。
# Scene Blueprint 由 Entity Blueprint（composition_schema.yaml）推导而来：
# Entity Blueprint 是「组合哪些 Feature」的计划；Scene Blueprint 是「如何实例化」的计划。
# 场景落盘后以 .tscn + feature.yaml（能力契约）为准。

schema:
  id: scene_blueprint
  version: 1

# ---------- 输入格式（Scene Blueprint） ----------

scene:
  id: <snake_case 场景 id，如 enemy_basic；缺省时取 entity.id>

root:
  type: <Godot 节点类型，如 CharacterBody2D / Area2D / Node2D>
  name: <PascalCase 根节点名，如 EnemyBasic；决定输出 Scenes/<name>.tscn>

components:
  - feature: <feature id，必须存在于 feature_index.json>
    instance:                                 # 可选（Phase 1.8.14）：组件实例计划（能力契约证据）
      node_type: <Godot 节点类型>             # 必需；必须在 component_instance_resolver 词表内
      children: [<节点类型>]                  # 可选：实例自带的子节点类型
      resources: [<节点类型>]                 # 可选：实例自带的资源节点类型（当前仅携带）
      parent: <父节点名>                      # 可选：声明式挂载点（当前不驱动生成）

nodes:
  - type: <额外结构节点类型，如 CollisionShape2D>
    name: <可选，缺省取 type>

capabilities:                                 # 可选（Phase 1.8.11）：本次组合需要的能力
  required: [<capability 名>]                 # = 成员 Feature 声明 ∪ 本键声明（并集，保序去重）；
                                              # 只承载与传递，是否支持由 Compatibility Gate 判定

validation:
  required_tests:
    - <组成 Feature id；每个 id 的 self_test 必须在场景生成后回归>

# ---------- Entity Blueprint 自动推导规则 ----------
# scene_composer.py 也接受 Entity Blueprint（entity: / features:），按以下规则
# 推导 Scene Blueprint：
#   scene.id  = entity.id
#   root.name = PascalCase(entity.id)   （basic_enemy -> BasicEnemy）
#   components = features 逐项映射（经 Feature Scene Template）
#   root.type 推导：任一成员 template 声明 scene.root_type 则取其交集要求
#                   （如 CharacterBody2D）；否则 enemy/player 角色 -> CharacterBody2D，
#                   其余 -> Node2D。
#   root.scene 推导（Phase 1.11）：恰有一个成员声明 attach.root_instance: true 时，
#                   实体根**就是**该 Feature 的入口场景（实例化为根），该组件不再作为
#                   子节点实例化。多个成员同时声明 → 拒绝生成并报 Root instance conflict
#                   （不静默二选一）。理由：根脚本型组件（如 chase_movement）作为子节点时
#                   只移动自己，实体根不动；场景会「看起来对、实际不动/不结算伤害」。
#   nodes 推导（Phase 1.11）：作者声明的 nodes 原样保留，并追加成员 template 声明的
#                   结构节点（attach.nodes，如 CollisionShape2D 碰撞形状）；同一
#                   (parent, name) 由作者声明优先，绝不产出重名节点。
#   显式 Scene Blueprint（作者自己写 root: / components:）**不走推导**：
#                   实例化计划由作者负责，场景层不重新解释它。

# ---------- Feature Scene Template（Features/<id>/template.yaml） ----------
#
# 每个 Feature 用 template.yaml 描述「如何被实例化」（Source of Truth 仍是
# feature.yaml 的 composition.entry_scene，template.yaml 与之保持一致）：
#
# feature:
#   id: health
#
# scene:
#   source: Health.tscn        # Feature 入口场景（相对 Feature 目录）
#   root_type: CharacterBody2D # 可选：宿主实体根必须的节点类型
#
# attach:
#   parent: root               # 实例化位置（v1 仅支持 root）
#   root_instance: true        # 可选（Phase 1.11）：本 Feature 的入口场景即宿主实体根
#                              #   （实例化为根，而不是子节点）；Entity Blueprint 推导用
#   nodes:                     # 可选（Phase 1.11）：本组件在宿主场景中需要的结构节点
#     - type: CollisionShape2D #   （挂在本组件节点下；组件为根实例时即实体根之下）
#       name: ContactShape
#       shape: {type: rectangle, size: [36, 36]}
#
# validation:
#   required_nodes:
#     - Health                 # 生成的场景必须存在的节点名
#
# instance:                    # 可选（Phase 1.8.14）：组件实例计划（Scene Intent 证据）
#   node_type: Area2D          # 组件入口场景自带的节点类型
#   children:                  # 可选：实例自带的子节点类型
#     - CollisionShape2D
#
# interfaces:
#   signals:                   # 生成的测试将逐一 has_signal 断言
#     - health_changed
#     - died

rules:
  - Scene 只负责组合与实例化；不拥有 Gameplay State、不写仲裁脚本（Round 8 结论）。
  - 能力需求由 Feature 侧产生（feature.yaml → capabilities.required）；Scene Blueprint 的
    capabilities.required 是可选中转键（只承载、去重、传递），不得在此声明「能力是否被支持」。
  - 组件一律通过 Feature Scene Template 以实例化（instance=ExtResource）加入，
    禁止复制 Feature 代码进实体场景。
  - 组件实例计划（components[].instance / template.yaml instance:）是**声明式证据**，
    不是生成指令：它只供能力契约核对（Phase 1.8.14），不改变 .tscn 生成结果；
    禁止按 component id / 名字推断实例。
  - 实体根可以是某个成员的入口场景实例（root.scene，来自 template.yaml 的
    attach.root_instance）：此时不得再把该组件作为子节点实例化（否则得到第二个行为
    组件、且实体根仍不承担运动职责）；
    template.yaml 的 attach.nodes 是**生成指令**（与 instance 声明不同）：实体根 / 组件下
    需要的碰撞形状等结构节点会被写入 Scene Blueprint 的 nodes[]。
  - 成员的 relations.requires 与顶层 requires 必须由组合满足，否则拒绝生成。
  - 输出固定为 Scenes/<root.name>.tscn；配套测试为 Tests/test_<scene.id>.gd（由
    test_generator 生成）。
  - 禁止 Entity Manager / Gameplay Manager / Feature Manager / Global Singleton。
  - 静态校验通过 ≠ 玩法通过：实体根的移动 / 接触伤害必须在真实 Godot 里由行为探针
    验证（.ai/tools/e2e/behavior_probe.py）；回归见 .ai/tools/e2e/tests/test_end_to_end_generation.py。

example:
  scene:
    id: enemy_basic
  root:
    type: CharacterBody2D
    name: EnemyBasic
  components:
    - feature: health
    - feature: contact_damage
      instance:                  # 可选（Phase 1.8.14）：组件实例计划（能力契约证据）
        node_type: Area2D
        children: [CollisionShape2D]
    - feature: chase_movement
  nodes:
    - type: CollisionShape2D
  validation:
    required_tests:
      - health
      - contact_damage
      - chase_movement

example_entity:                # Entity Blueprint 形式（Phase 1.11 的推荐写法）
  entity:
    id: enemy_basic
    role: enemy
  features: [health, contact_damage, chase_movement]
  validation:
    required_tests: [health, contact_damage, chase_movement]
  # 推导结果（无需手写）：root.scene = res://Features/chase_movement/ChaseMovement.tscn，
  # nodes = [ContactShape(ContactDamage), Collision(根)]（来自成员模板），
  # 生成的 .tscn 根为 ChaseMovement 实例 → 追击脚本驱动实体本身。
