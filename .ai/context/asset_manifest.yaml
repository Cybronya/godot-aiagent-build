assets:

  - id: slime_frames
    path: res://Assets/characters/enemy/slime/slime_frames.tres
    category: enemy
    type: sprite_frames
    subject: slime
    tags: [slime, sprite_frames, enemy]
    confirmed: true
    status: approved
    notes: "史莱姆 4 个动画（idle/move/attack/hurt）；占位帧，分类经确认"

  - id: player_frames
    path: res://Assets/characters/player/player_frames.tres
    category: player
    type: sprite_frames
    subject: player
    tags: [player, sprite_frames]
    confirmed: true
    status: approved
    notes: "玩家 4 个动画（idle/run/attack/hurt）；占位帧，分类经确认"

  - id: slime_hurt_sfx
    path: res://Assets/audio/slime/hurt.wav
    category: audio
    type: audio
    subject: slime
    role: hurt
    tags: [slime, hurt, sfx]
    confirmed: true
    status: approved
    notes: "史莱姆受击音效（占位正弦波）"

