# Feature Scene Template: trigger_switch

feature:
  id: trigger_switch

scene:
  source: trigger_switch.tscn

attach:
  parent: root

validation:
  required_nodes:
    - TriggerSwitch

interfaces:
  signals:
    - activated

# 组件实例计划（Phase 1.37）：声明本组件入口场景自带的节点结构。
# 作用 = 能力契约证据（Phase 1.8.14 机制）：不声明时契约只能看到「组件」，
# 看不到其内部节点，依赖 Collision 的组合会被误判为 BLOCKED
# （Phase 1.36 评估 T1 的首次失败原因）。
# 约束：只声明 trigger_switch.tscn = Area2D + TriggerShape(CollisionShape2D) 中真实存在的结构与直接子节点类型；
#       本声明不驱动生成（Builder 不消费它），因此 .tscn 输出不变。
instance:
  node_type: Area2D
  children:
    - CollisionShape2D

# 运行时实例证据（Phase 1.39）：要求 Godot 真实加载后的对象树满足本声明。
# 期望由 node_type / children 推导（根 + 直接子节点类型与数量），
# 静态结构不需要轮询；失败由 runtime_instance_evidence.py 报 MISMATCH/INSUFFICIENT。
  runtime:
    when: after_load        # 观察时机：加载完成并稳定 2 帧
    timeout_frames: 0       # 0 = 不轮询（静态结构）

# 行为证据（Phase 1.42）：真实物理接触 + 受控帧推进。
# physics.overlap 在开关位置生成真实 CharacterBody2D（players 组），
# 由物理帧触发 Area2D.body_entered；不调用私有回调，也不手改 _triggered。
behavior:
  - id: latch_once
    actions:
      - {type: physics.overlap, target: ".", params: {group: players}}
      - {type: simulation.advance_frames, params: {frames: 6}}
      - {type: physics.overlap, target: ".", params: {group: players}}
    preconditions:
      - {check: trigger.is_triggered, target: ".", equals: false}
      - {check: signal, entry: trigger.activated, target: ".", count: 0}
    expected:
      - {check: trigger.is_triggered, target: ".", equals: true}
      - {check: signal, entry: trigger.activated, target: ".", count: 1, last_args: [true]}
    window_frames: 30

  # Toggle 模式无法用合法动作从默认 Latching 构造 → 使用协议声明的受限夹具
  # （state.set_property 只能写 trigger_mode，且必须排在行为动作之前）。
  - id: toggle_on_second_contact
    actions:
      - {type: state.set_property, target: ".",
         params: {property: trigger_switch.trigger_mode, value: Toggle}}
      - {type: physics.overlap, target: ".", params: {group: players}}
      - {type: simulation.advance_frames, params: {frames: 6}}
      - {type: physics.overlap, target: ".", params: {group: players}}
    preconditions:
      - {check: trigger.is_triggered, target: ".", equals: false}
    expected:
      - {check: trigger.is_triggered, target: ".", equals: false}
      - {check: signal, entry: trigger.activated, target: ".", count: 2, last_args: [false]}
    window_frames: 30
